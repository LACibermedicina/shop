# ============================================================
# nginx — shop.m3d.pro
# TLS 1.3 OBRIGATÓRIO em todo o tráfego (requisito de conformidade)
# PHP em 127.0.0.1:8000 · Microsserviço Python (IA/PDF/webhooks) em 127.0.0.1:8001
# ============================================================

server {
    listen 80;
    server_name shop.m3d.pro;
    return 301 https://$host$request_uri;   # redireciona tudo para HTTPS
}

server {
    listen 443 ssl http2;
    server_name shop.m3d.pro;

    # --- TLS 1.3 (com fallback controlado para 1.2 apenas se necessário) ---
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_certificate     /etc/letsencrypt/live/shop.m3d.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.m3d.pro/privkey.pem;

    # --- Headers de segurança (HSTS) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    root /var/www/m3d-telemedicina/public;
    index index.php;

    # Frontend PHP
    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # ou 127.0.0.1:9000
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Microsserviço Python (IA / PDF / webhooks) — apenas internamente via proxy
    location /api/python/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Bloqueia acesso HTTP direto ao banco e ao armazenamento privado
    location ^~ /data/ { deny all; }
}
